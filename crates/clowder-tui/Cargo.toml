[package]
name = "clowder-tui"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "The ratatui shell for clowder"

[lib]
name = "clowder_tui"
path = "src/lib.rs"

[[bin]]
name = "clowder"
path = "src/main.rs"

[dependencies]
clowder-core = { path = "../clowder-core" }
ratatui = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
