[workspace]
resolver = "2"
members = ["crates/clowder-core", "crates/clowder-tui"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Jess Szmajda"]
repository = "https://github.com/jszmajda/clowder"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
directories = "5"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
