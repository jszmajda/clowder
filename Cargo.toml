[workspace]
resolver = "2"
members = ["crates/clowder-core", "crates/clowder-tui"]

[workspace.package]
version = "1.3.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Jess Szmajda"]
repository = "https://github.com/jszmajda/clowder"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
directories = "5"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }

# Debug builds, and so the tests, are lightly optimised. The slowest tests simulate and render a lot,
# and opt-level 1 runs them several times faster than an unoptimised build for a few more seconds on
# a cold build. Overflow checks and debug assertions stay on, as in any dev build.
[profile.dev]
opt-level = 1
