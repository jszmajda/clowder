# Grouped by the two crates the HLD's architecture splits on: the headless
# simulation and the terminal shell. Persistence sits with the sim crate it
# lives in, though the design tree hangs it off the root.
#
# blocks/blockedBy carry build order only as the design docs state it: the sim
# edges are the sim sub-HLD's Build Waves (each wave blocked by the one before;
# no edges inferred within a wave), and the tui edges are the tui sub-HLD's
# stated leaf order plus navigation's declared dependency on the engine's
# queries. A segment is ready when every segment in its blockedBy is OK.
taxonomy:
  sim:
    - achievements
    - adventures
    - ceremonies
    - colonies
    - cosmic
    - curiosity
    - dreamtime
    - economy
    - engine
    - expeditions
    - kittens
    - mystic
    - prestige
    - persistence
  tui:
    - navigation
    - render
    - runtime
    - theme

